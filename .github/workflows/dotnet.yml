name: .NET

on:
  push:
    branches: [ main, "foundation/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FrameworkMultijuegos.sln

      - name: Build
        run: dotnet build FrameworkMultijuegos.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FrameworkMultijuegos.sln --configuration Release --no-build --verbosity normal
